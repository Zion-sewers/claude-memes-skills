# claude-memes emotion hubs — the semantic layer for auto mode.
# ---------------------------------------------------------------
# Auto mode embeds a workflow concept (an unmapped command, skill, or moment)
# and matches it against these hubs by cosine similarity. `description` is the
# text that gets embedded; `queries` is the curated Giphy pool the hub draws
# from (one is picked per firing). Hub-and-spoke: concepts route to a hub, the
# hub carries the joke — direct concept→GIF search is noisier and less funny.
#
# Ships embedded in the binary; edit descriptions/queries and rebuild, or use
# `claude-memes find "<concept>"` to see how a concept routes.

[hubs.triumph]
description = "complete success, everything works perfectly, total victory"
queries = ["we did it celebration", "victory dance excited"]

[hubs.despair]
description = "everything is broken and hopeless, nothing works at all"
queries = ["head in hands despair", "why me frustrated"]

