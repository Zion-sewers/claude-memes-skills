name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build release
        run: cargo build --release

      - name: Notify on failure
        if: failure()
        run: echo "::error::CI job failed — check the logs above for details"

  giphy-smoke:
    name: live Giphy smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Resolve every registry event against the live Giphy API
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          if [ -z "$GIPHY_API_KEY" ]; then
            echo "GIPHY_API_KEY not available (fork PR?) — skipping live smoke test."
            exit 0
          fi
          # Portable extraction (no GNU-only grep -P), and fail loudly if it
          # yields nothing so a parse failure can never masquerade as a pass.
          events=$(grep -E '^\[events\.' config/events.toml | sed -E 's/^\[events\.//; s/\]$//')
          if [ -z "$events" ]; then
            echo "::error::extracted zero events from config/events.toml — sweep would be vacuous"
            exit 1
          fi
          echo "sweeping $(echo "$events" | wc -w) events"
          failed=0
          for event in $events; do
            if ./target/release/claude-memes play "$event" --check; then :; else
              echo "::error::event '$event' failed to resolve a GIF"
              failed=1
            fi
          done
          exit $failed

      - name: Notify on failure
        if: failure()
        run: echo "::error::CI job failed — check the logs above for details"
